name: Build watch app
on: { push: { branches: [feature/compass-clean] }, workflow_dispatch: {} }
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd EnochWatch && xcodegen
      - run: cd EnochWatch && xcodebuild -project EnochWatch.xcodeproj -scheme EnochWatch -destination 'generic/platform=watchOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -60
        shell: bash -o pipefail {0}
