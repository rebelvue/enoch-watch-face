 g.font='700 9px '+MONO;var w=Math.max(g.measureText(top).width,(g.font='800 '+fs+'px '+MONO,g.measureText(big).width))+10,x0=al==='left'?x-5:x-w+5,y0=y-9,h=34,c=6;
 g.font='700 9px '+MONO;g.fillStyle=ACC;g.fillText(top,x,y);g.font='800 '+fs+'px '+MONO;g.fillStyle='#fff';g.fillText(big,x,y+17);
 g.shadowBlur=0;g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=1;g.beginPath();

function poly(c,pts,close){c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);if(close)c.closePath();}

// corner tile: icon + value only, inside angled brackets; icon sits on the outer side
function ichip(x,y,al,icon,args,val,vcol){g.save();g.font='800 16px '+MONO;var tw=g.measureText(val).width,w=22+6+tw+10,h=30,c=6;
 var x0=al==='left'?x-5:x-w+5,y0=y-h/2,ix=al==='left'?x0+5+11:x0+w-5-11,tx=al==='left'?ix+11+6:ix-11-6;
 g.shadowColor='rgba(0,0,0,.9)';g.shadowBlur=4;g.textAlign=al==='left'?'left':'right';g.textBaseline='middle';g.fillStyle=vcol||'#fff';g.fillText(val,tx,y+1);
 g.save();g.translate(ix,y);g.lineWidth=1.6;g.lineJoin='miter';ICON[icon].apply(null,[g].concat(args));g.restore();
 g.shadowBlur=0;g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=1;g.beginPath();
 [[x0,y0,1,1],[x0+w,y0,-1,1],[x0,y0+h,1,-1],[x0+w,y0+h,-1,-1]].forEach(function(b){g.moveTo(b[0]+b[2]*(c+4),b[1]);g.lineTo(b[0]+b[2]*3,b[1]);g.lineTo(b[0],b[1]+b[3]*3);g.lineTo(b[0],b[1]+b[3]*(c+2));});
 g.stroke();g.restore();}
function corners(now,S){getWx();var se=sunEvent(now,S);

 // top: live place name + next sun event countdown, then local date; bottom: coordinates

 g.save();g.textAlign='center';g.textBaseline='middle';g.font='800 11px '+MONO;g.fillStyle='#fff';

 g.font='800 9px '+MONO;g.fillStyle='#fff';g.fillText(Math.abs(pos.lat).toFixed(3)+(pos.lat>=0?'N':'S')+' / '+Math.abs(pos.lon).toFixed(3).padStart(7,'0')+(pos.lon>=0?'E':'W')+(pos.src.indexOf('GPS')===0?'':' FALLBACK'),CX,H-11);g.restore();}

function setZoom(z){zoom=Math.min(ZF,Math.max(1,z));localStorage.setItem('enochZoom',zoom);draw();}
var anim=null;function animTo(t){var z0=zoom,t0=performance.now();cancelAnimationFrame(anim);
 (function step(n){var k=Math.min(1,(n-t0)/280),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;setZoom(z0+(t-z0)*e);if(k<1)anim=requestAnimationFrame(step);})(t0);}
function toggle(){animTo(zoom<(1+ZF)/2?ZF:1);}
var pinch=null,lastTap=0;
cv.addEventListener('touchstart',function(e){if(e.touches.length===2){var a=e.touches[0],b=e.touches[1];pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),z:zoom};e.preventDefault();}
 else if(e.touches.length===1){var t=Date.now();if(t-lastTap<300){toggle();e.preventDefault();lastTap=0;}else lastTap=t;}},{passive:false});
cv.addEventListener('touchmove',function(e){if(pinch&&e.touches.length===2){var a=e.touches[0],b=e.touches[1];setZoom(pinch.z*Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/pinch.d);}e.preventDefault();},{passive:false});
