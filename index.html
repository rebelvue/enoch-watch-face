 if(Math.abs(TV.x)+Math.abs(TV.y)>.01)mv=true;
 if(SCR&&n-wheelAt>2000)SCR=0;var w2=2*Math.PI/.7;SCV+=(-w2*w2*(SCS-SCR)-2*.9*w2*SCV)*dt;SCS+=SCV*dt;
 if(Math.abs(SCS-SCR)<3e4&&Math.abs(SCV)<6e4){SCS=SCR;SCV=0;}else mv=true;
 if(DET&&Date.now()-detAt>6000){DET=null;mv=true;}
 if(mv&&!zRun)draw();},16);
</script></body></html>
